default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgres://postgres:@localhost/employee_book" } %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL_TEST") { "postgres://postgres:@localhost/employee_book_test" } %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgres://postgres:@localhost/employee_book_production" } %>
